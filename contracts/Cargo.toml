[workspace]
resolver = "2"
members = [
  "contracts/refugee_identity",
  "contracts/payroll_escrow",
  "contracts/aid_vault",
  "contracts/merchant_payment"
]

[workspace.dependencies]
soroban-sdk = { version = "25.3.1", features = [] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
