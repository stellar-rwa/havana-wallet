name: Havana Platform CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validation:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter havana-backend prisma:generate

      - name: Backend Lint
        run: pnpm --filter havana-backend lint

      - name: Frontend Build & Lint
        run: |
          pnpm --filter frontend build
          pnpm --filter frontend lint

  contract-audit:
    name: Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Run Clippy
        run: cargo clippy -- -D warnings
        working-directory: contracts

      - name: Run Tests
        run: cargo test
        working-directory: contracts
